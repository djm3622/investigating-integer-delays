# Letter loss comparison: losses x excitations x source counts x clean/40 dB, seed 0.
datasets:
  comb: data/vary_all_pluck
  triangle: data/vary_all_triangle
losses: [log, lin, tilt, mr_lin, mr_log]
source_counts: [1, 2, 3, 5, 7]
snr_db: [null, 40]        # null: clean target
instances: 16
instances_drawn: 32       # files are drawn for 32 instances per source count
selection_seed: 1729
seed: 0
model:
  L_min: 100
  L_max: 200
  position_min: 1
  position_max: 100
  initial_K: 0.9
  initial_a: 0.5
  gain_min: 0.5
  gain_max: 1.0
fit:
  n_fft: 8192
  search_syntheses: 50000   # per source, charged to the restarts
  refine_steps: 20000
  refine_lr: 0.01
  gd_steps: 1500
